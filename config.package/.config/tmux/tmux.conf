# --- Terminal & Protocolos Modernos (Kitty) ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty*:RGB:hyperlinks:mouse:clipboard:extkeys"
set -s extended-keys on
set -g allow-passthrough on
set -s escape-time 0
set -g focus-events on
set-option -g xterm-keys on

# --- Clipboard & Mouse ---
set-option -g mouse on
set -s set-clipboard on
# Não pula pro fim da tela ao soltar a seleção do mouse
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# --- Modo Vi & Histórico (Essencial para AGY / Claude Code) ---
setw -g mode-keys vi
set -g history-limit 50000
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# --- Janelas e Painéis ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Manter o diretório atual ao criar novos painéis/janelas
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Tema e Cores (Matugen) ---
if-shell "[ -f ~/.config/tmux/generated.conf ]" "source-file ~/.config/tmux/generated.conf"

