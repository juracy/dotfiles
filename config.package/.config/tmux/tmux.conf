# --- Terminal & Modern Protocols (Kitty) ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty*:RGB:hyperlinks:mouse:clipboard:extkeys"
set -s extended-keys on
set -g allow-passthrough on
set -s escape-time 0
set -g focus-events on
set-option -g xterm-keys on

# --- Prefix Keys ---
# Keep default prefix (Ctrl-B) and add Ctrl-A as secondary prefix
set -g prefix2 C-a
bind C-a send-prefix -2

# --- Clipboard & Mouse ---
set-option -g mouse on
set -s set-clipboard on
# Do not jump to the bottom of the screen when releasing mouse selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# --- Vi Mode & History (Essential for AGY / Claude Code) ---
setw -g mode-keys vi
set -g history-limit 50000
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# --- Windows & Panes ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep current directory when creating new panes/windows
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Extended Keys & Multiline (Claude Code, AGY, etc.) ---
bind -n S-Enter send-keys Escape Enter
bind -n C-Enter send-keys Escape Enter

# --- Status Bar & Window Status ---
set -g window-status-separator ""
# Rename window to 🤖️ + last dir component while Claude Code is running
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{==:#{pane_current_command},claude},🤖️ #{b:pane_current_path},#{pane_current_command}}}#{?pane_dead,[dead],}"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W#{?window_zoomed_flag, [Z],} "
set -g window-status-style "fg=colour245"
set -g window-status-current-style "bg=colour4,fg=colour0,bold"

# --- Theme & Colors (Matugen) ---
if-shell "[ -f ~/.config/tmux/generated.conf ]" "source-file ~/.config/tmux/generated.conf"


