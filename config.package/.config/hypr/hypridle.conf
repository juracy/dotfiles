# Idle timeouts (lock / screen off / suspend) and the lock screen itself are managed by Dux Shell
# (DankMaterialShell settings.json: ac*/battery*Timeout, loginctlLockIntegration). hypridle only keeps the
# one thing Dux Shell can't do: blank the screen and wait before the system suspends.
#
# Why: NVIDIA driver bug (seen on 615.78.08, no fix yet): suspending sometimes loses a sync fence
# (kernel: "nvidia-drm ... Failed to register auto-value-update ... sync FD semaphore surface") and whichever
# GPU client had a frame in flight hangs after resume: EGL apps (kitty) spin at 100% CPU, Chrome renders but
# ignores keyboard/mouse. Blanking the screen first reduces the window but does NOT prevent it (tested
# 2026-11-11), so after resume ~/.local/bin/nvidia-resume-check notifies and lists the hung apps.
#
# How: before_sleep_cmd is spawned asynchronously; inhibit_sleep = 3 holds logind's sleep inhibitor until
# the session lock is confirmed. `loginctl lock-session` brings up the Dux Shell lock screen. Dux Shell's
# "lockBeforeSuspend" stays off so the screen goes dark before the lock screen starts drawing.
general {
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="off"})'; sleep 1; loginctl lock-session
    # dpms on: avoid pressing a key twice to wake the display. nvidia-resume-check: notify if the driver lost
    # a fence during this suspend and list hung GPU clients (full path: ~/.local/bin isn't in hypridle's PATH).
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'; ~/.local/bin/nvidia-resume-check &
    inhibit_sleep = 3
}

# No-op: hypridle reports "Config has errors: No rules configured" without at least one listener.
listener {
    timeout = 86400
    on-timeout = true
}
